name: Windows x64 build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and test
        shell: cmd
        run: call build.cmd test
      - name: Package the Mod Platform build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'dist/staging/fh3-mods' -Force | Out-Null
          Copy-Item 'build/WreckingBallPlatform.dll' 'dist/staging/fh3-mods/WreckingBall.dll'
          Copy-Item 'Readme.txt' 'dist/staging/Readme.txt'
          $name = 'WreckingBall-FH3-Mod-Platform-1.0.0.zip'
          $source = 'WreckingBall-FH3-Source-1.0.0.zip'
          Compress-Archive -LiteralPath 'dist/staging/fh3-mods','dist/staging/Readme.txt' -DestinationPath "dist/$name"
          git archive --format=zip --prefix=WreckingBallFH3-1.0.0/ --output="dist/$source" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the source archive.' }
          $checksums = foreach ($asset in @($name, $source)) {
            $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          Set-Content 'dist/SHA256SUMS.txt' -Value (($checksums -join [char]10) + [char]10) -Encoding ascii -NoNewline
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: WreckingBall-FH3-win-x64
          path: |
            dist/WreckingBall-FH3-Mod-Platform-1.0.0.zip
            dist/WreckingBall-FH3-Source-1.0.0.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  initial-release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'Laur1sXd/WreckingBallFH3'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: wreckingball-release-v1.0.0
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: WreckingBall-FH3-win-x64
      - name: Publish the 1.0.0 release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(WreckingBall-FH3-Source-1.0.0.zip WreckingBall-FH3-Mod-Platform-1.0.0.zip SHA256SUMS.txt)
          sha256sum --check SHA256SUMS.txt
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json body --jq .body > current-notes.md; then
            if grep -Fq '## November 7 update' current-notes.md; then exit 0; fi
            original_tag=c5eca07c0b50aac4663134f43f1c3a0876d726c2
            current_tag=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.0" --jq .object.sha)
            if [ "$current_tag" != "$original_tag" ]; then exit 0; fi
            gh release upload v1.0.0 "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            printf '\n' >> current-notes.md
            sed -n '/^## November 7 update$/,$p' RELEASE_NOTES.md >> current-notes.md
            gh release edit v1.0.0 --repo "$GITHUB_REPOSITORY" --notes-file current-notes.md
            exit 0
          fi
          gh release create v1.0.0 "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'WreckingBall FH3 1.0.0' \
            --notes-file RELEASE_NOTES.md
