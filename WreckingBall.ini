; WreckingBall settings for Forza Horizon 3. Changes here apply the next time you start the game.
; The main switches are also in the game, under Pause > MODS > Installed mods > WreckingBall.
; Use D-pad or left-stick Left/Right to preview values. Press A to apply all changes.
; Delete this file to get the defaults back.
[WreckingBall]

; 1 = WreckingBall is on, 0 = FH3 uses its own scenery rules
Enabled=1

; ---- trees ----
; 1 = eligible trees break when you hit them, 0 = they stay solid
InjectTrees=1
; share of your speed a normal tree takes (0.12 = 12%). Bigger trees take more, up to SpeedLossMax.
; SpeedLossMax=0 turns off the extra slowdown for every object WreckingBall adds.
SpeedLoss=0.12
SpeedLossMax=0.45
; how much more speed big trees take than small ones
SpeedLossExponent=1.5
; trees at least this big (1 = a normal tree) use big-tree physics
LumberjackMinSize=1.6
; models whose name contains one of these stay as they are in FH3
SkipModels=ROOT_

; ---- fences, railings, guardrails and bollards ----
; 1 = enable barrier conversion. The switches below choose which eligible barriers break.
Barriers=1
Fences=1
Railings=1
Guardrails=1
Bollards=1
; anything whose model name contains one of these stays solid
BarrierExclude=Crowd,FEST_,Carmeet,Banner,Festival,Concrete,Blast,Wall,Bridge,Gate,Hydraulic,Tyre,Tire
; 1 = barriers that only appear for an event stay solid
BarrierSkipEvents=1
; 1 = a barrier only breaks where there is terrain on both sides
BarrierNeedGround=1
; share of your speed a barrier takes
BarrierSpeedLoss=0.04

; ---- benches ----
; 1 = solid wood-topped benches across mainland Australia break on impact
ConcreteBenches=1

; ---- clean-up ----
; 1 = broken pieces fade out after a while, 0 = they stay until the game clears them
DebrisCleanup=1
; after this many seconds, or once you are this many metres away (0 = no limit of that kind)
DebrisLifetime=45
DebrisDistance=120

; ---- other ----
; names the mod looks for at the start of tree model names (* = all)
Prefix=*
; scenery libraries that keep their original behavior
ExcludeLibraries=Festival,Crowd,Carmeet,Building,Bridge,Railway,Train,Checkpoint,Grandstand
; tree size multipliers (name fragment and multiplier)
SizeRules=Skinny:0.8,Palm:0.9,Pine:1.3,Tall:1.3
; distance used to match confirmed tree or barrier collision to an object, in metres
TrunkRadius=1.6
BarrierPointRadius=0.9
; 1 = detailed WreckingBall.log. F8 writes nearby scenery to it at any Debug setting.
Debug=0
